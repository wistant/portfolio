name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with: { version: 10.26.1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 1. Extract the predicted next version for the PR title
      - name: Get next version
        id: next_version
        run: |
          VERSION=$(./tooling/version/get-next-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 2. Runs versioning or generate pure GitHub release via action
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: bash tooling/release/github-release.sh
          commit: "release: ${{ steps.next_version.outputs.version }}"
          title: "release: ${{ steps.next_version.outputs.version }}"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Format the Changesets Release PR description with Wistant's custom layout
      - name: Format Changesets PR Description
        if: steps.changesets.outputs.hasChangesets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Find the open Changesets Release PR
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:changesets-release/main`
            });

            if (!pulls || pulls.length === 0) {
              console.log("No open Changesets Release PR found.");
              return;
            }

            const pr = pulls[0];
            const prNumber = pr.number;
            console.log(`Found Changesets Release PR #${prNumber}`);

            // 2. Fetch the commits inside this PR
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (!commits || commits.length === 0) {
              console.log("No commits found in this PR.");
              return;
            }

            const categories = {
              feat: "Features",
              fix: "Bug Fixes",
              docs: "Documentation",
              ui: "UI / Design",
              style: "Formatting & Style",
              refactor: "Refactoring",
              perf: "Performance Improvements",
              test: "Tests",
              ci: "CI / Infrastructure",
              chore: "Maintenance Tasks",
              other: "Other Changes"
            };

            const buckets = {};
            for (const key of Object.keys(categories)) {
              buckets[key] = [];
            }

            for (const c of commits) {
              const message = c.commit.message.split('\n')[0];
              const hash = c.sha.substring(0, 7);
              const author = c.author ? c.author.login : c.commit.author.name;
              
              // Extract type prefix (e.g. feat, fix, etc.)
              const typeMatch = message.match(/^([a-z]+)/);
              const type = typeMatch && categories[typeMatch[1]] ? typeMatch[1] : 'other';
              
              buckets[type].push(`- [\`${hash}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${hash}) - ${message} (by @${author})`);
            }

            let prBody = "## 📝 Summary of Changes\nThis Pull Request introduces the following logical adjustments:\n\n";
            
            for (const type of ['feat', 'fix', 'ui', 'style', 'refactor', 'docs', 'ci', 'perf', 'test', 'chore', 'other']) {
              if (buckets[type] && buckets[type].length > 0) {
                prBody += `### ${categories[type]}\n`;
                prBody += buckets[type].join('\n') + '\n\n';
              }
            }

            // 3. Update the Changesets PR body
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: prBody
            });

            console.log("Successfully formatted Changesets PR description.");
